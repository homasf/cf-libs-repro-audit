[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-libs-repro-audit"
version = "2.0.1.dev0"
description = "CF-LIBS Reproducibility Audit: executable A1-A5 checks for reconstructing quantitative claims from printed CF-LIBS/LIPS records."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Homa Saeidfirozeh" },
]
keywords = [
  "CF-LIBS",
  "LIBS",
  "LIPS",
  "calibration-free",
  "reproducibility",
  "metrology",
  "Stark broadening",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]
dev = ["build>=1.2", "pytest>=7", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/homasf/cf-libs-repro-audit"
Repository = "https://github.com/homasf/cf-libs-repro-audit"
Issues = "https://github.com/homasf/cf-libs-repro-audit/issues"

[project.scripts]
cf-libs-audit = "libs_repro_audit.cli:main"
cf-libs-audit-extract = "libs_repro_audit.extract:main"
cf-libs-repro-audit = "libs_repro_audit.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libs_repro_audit = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

