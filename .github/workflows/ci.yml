name: audit-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
      - run: python scripts/make_figure2.py
      - run: python scripts/make_validation_figure.py
      - run: python -m libs_repro_audit.cases
      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          (cd /tmp && "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m libs_repro_audit)
          (cd /tmp && "$GITHUB_WORKSPACE/.wheel-smoke/bin/cf-libs-audit" --worked-example -o audit_report.html)
          (cd /tmp && "$GITHUB_WORKSPACE/.wheel-smoke/bin/cf-libs-audit-extract" --help)
          (cd /tmp && "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m libs_repro_audit.cases --output wheel_cases.json)
